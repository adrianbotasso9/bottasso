[options]
SigLevel = Never
Architecture = x86_64

# Repositorios de base (mismos que el perfil principal)
[core]
Server = https://mirror.pkgbuild.com/core/os/x86_64

[extra]
Server = https://mirror.pkgbuild.com/extra/os/x86_64

[multilib]
Server = https://mirror.pkgbuild.com/multilib/os/x86_64

# Repositorios CachyOS (x86_64 y v3)
[cachyos]
Server = https://mirror.cachyos.org/repo/x86_64/cachyos

[cachyos-core-v3]
Server = https://mirror.cachyos.org/repo/x86_64_v3/cachyos-core-v3

[cachyos-v3]
Server = https://mirror.cachyos.org/repo/x86_64_v3/cachyos-v3

[cachyos-extra-v3]
Server = https://mirror.cachyos.org/repo/x86_64_v3/cachyos-extra-v3
