name: BOTASSO OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate os-release source
        run: |
          grep -q '^ID=bottasso' src/os-release/base          || { echo "ID=bottasso not found"; exit 1; }
          grep -q '^NAME="BOTASSO OS"' src/os-release/base     || { echo "NAME=BOTASSO OS not found"; exit 1; }
          echo "os-release source OK"

      - name: Validate rebrand.sh
        run: |
          bash -n scripts/rebrand.sh && echo "rebrand.sh syntax OK" || { echo "rebrand.sh syntax error"; exit 1; }

      - name: Validate README
        run: |
          grep -q 'adrianbotasso9/bottasso' README.md && echo "README OK" || { echo "README URL mismatch"; exit 1; }
